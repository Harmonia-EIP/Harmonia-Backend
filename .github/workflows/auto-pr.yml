name: Auto PR

# feature/* -> dev à chaque push. Le passage dev -> main reste manuel
# (pour pouvoir tester sur dev avant la mise en production).
on:
  push:
    branches-ignore: [main, dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR automatically
        env:
          # PAT dédié (Contents: RW, Pull requests: RW) — pas GITHUB_TOKEN,
          # sinon les checks ne se déclenchent pas sur la PR créée.
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PR_TOKEN manquant"
            exit 1
          fi

          count=$(gh pr list --head "$GITHUB_REF_NAME" --base dev --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base dev \
              --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --body "PR ouverte automatiquement depuis \`$GITHUB_REF_NAME\`." \
              --assignee "$GITHUB_ACTOR" \
              || echo "::warning::PR non créée (aucune différence avec dev ?)"
          else
            echo "Une PR existe déjà pour $GITHUB_REF_NAME -> dev"
          fi
