name: Auto PR dev -> main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR automatically
        env:
          # PAT dédié (Contents: RW, Pull requests: RW) — pas GITHUB_TOKEN,
          # sinon les checks ne se déclenchent pas sur la PR créée.
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            base="main"
          else
            base="dev"
          fi

          count=$(gh pr list --head "$GITHUB_REF_NAME" --base "$base" --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base "$base" \
              --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --body "PR ouverte automatiquement depuis \`$GITHUB_REF_NAME\`." \
              --assignee "$GITHUB_ACTOR"
          else
            echo "Une PR existe déjà pour $GITHUB_REF_NAME"
          fi

          # Auto-merge seulement pour la release dev -> main : pas de review
          # humaine attendue, les checks CI suffisent.
          if [ "$base" = "main" ]; then
            gh pr merge "$GITHUB_REF_NAME" --auto --merge
          fi