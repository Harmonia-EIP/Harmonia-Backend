name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-source:
    name: Check source branch
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev -> main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Seule la branche dev peut être mergée dans main (source: $HEAD_REF)"
            exit 1
          fi

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On travaille sur la branche de la PR (pas le merge commit) pour pouvoir
      # y pousser le formatage. PR_TOKEN : le push redéclenche la CI, ce que
      # GITHUB_TOKEN ne fait pas.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff format (auto-fix)
        run: ruff format .

      - name: Commit formatting
        # Impossible de pousser sur la branche d'un fork : on ignore alors.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "Code déjà formaté"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "[STYLE] ruff format"
          git push
          echo "::notice::Formatage appliqué et poussé sur la branche"

      - name: Ruff lint
        run: ruff check .

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
